name: CI

on:
  push:
    branches: [main]
    paths:
      - "spinesync-asmr-studio/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "spinesync-asmr-studio/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: spinesync-asmr-studio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: spinesync-asmr-studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
